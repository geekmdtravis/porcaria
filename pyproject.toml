[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "porcaria"
version = "0.1.0"
description = "Portable voice-AI pipeline (capture → ASR → LLM → sink) with pluggable providers and a long-lived daemon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Travis Nesbit" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
parakeet = ["nano-parakeet", "torch", "numpy"]
kokoro = ["kokoro-onnx", "soundfile", "numpy"]
cloud = []  # httpx already in base; cloud providers just need API keys
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
porcaria = "porcaria.cli:app"

[project.entry-points."porcaria.sinks"]
# Third-party sinks register here, e.g.:
# mytodo = "mypkg.sink:Sink"

[tool.hatch.build.targets.wheel]
packages = ["src/porcaria"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]
